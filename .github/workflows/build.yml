name: build

on:
  # this branch's own builds: app releases are tagged app-v* (v* belongs to the server)
  push:
    branches: [android-app]
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        if: startsWith(github.ref, 'refs/tags/') && env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build APK
        env:
          TUBEHAUS_KEYSTORE: ${{ startsWith(github.ref, 'refs/tags/') && secrets.KEYSTORE_B64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          TUBEHAUS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TUBEHAUS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TUBEHAUS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -z "$TUBEHAUS_KEYSTORE" ] && unset TUBEHAUS_KEYSTORE
          ./gradlew --no-daemon :android:assembleRelease
          mv android/build/outputs/apk/release/*.apk "TubeHaus-${GITHUB_REF_NAME//\//-}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: TubeHaus-*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: libmpv
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -like 'mpv-dev-x86_64-v3-*.7z' } | Select-Object -First 1
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -like 'mpv-dev-x86_64-*.7z' } | Select-Object -First 1 }
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv-dev.7z
          7z e mpv-dev.7z libmpv-2.dll -odesktop/resources/windows -y
      - name: Build installer
        run: ./gradlew --no-daemon :desktop:packageReleaseMsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/build/compose/binaries/main-release/msi/*.msi

  release:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # published by hand with a locally signed APK: only add the Windows installer
            gh release upload "$GITHUB_REF_NAME" windows/*.msi --repo "$GITHUB_REPOSITORY" --clobber
          else
            # a pre-release, so it never becomes the server's "latest release"
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "TubeHaus app ${GITHUB_REF_NAME#app-}" --prerelease --notes "Android and Windows app" \
              android/*.apk windows/*.msi
          fi
